name: Release to Google Play

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK platform
        run: sdkmanager "platforms;android-37"

      - name: Calculate version code
        id: version_code
        env:
          ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE }}
          ANDROID_VERSION_NAME_BASE: ${{ vars.ANDROID_VERSION_NAME_BASE }}
        run: |
          code_base="${ANDROID_VERSION_CODE_BASE:-101}"
          if ! [[ "$code_base" =~ ^[0-9]+$ ]]; then
            echo "ANDROID_VERSION_CODE_BASE must be a non-negative integer." >&2
            exit 1
          fi

          name_base="${ANDROID_VERSION_NAME_BASE:-1.2}"
          if ! [[ "$name_base" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "ANDROID_VERSION_NAME_BASE must be a dotted numeric version such as 1.2." >&2
            exit 1
          fi

          code=$((code_base + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_name="${name_base}.${GITHUB_RUN_NUMBER}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Check release credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Run checks and build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PciBuild -PciVersionCode=${{ steps.version_code.outputs.code }} -PciVersionName=${{ steps.version_code.outputs.name }} test lint assembleDebug :app:bundleRelease

      - name: Save release bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version_code.outputs.name }}-${{ steps.version_code.outputs.code }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Submit to Google Play
        uses: r0adkll/upload-google-play@e738b9d8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.azurenight.g2048
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          releaseName: ${{ steps.version_code.outputs.name }} (build ${{ steps.version_code.outputs.code }})

plugins {
    id 'com.android.application'
}

def releaseSigning = [
    storeFile: providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull,
    storePassword: providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').orNull,
    keyAlias: providers.environmentVariable('ANDROID_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('ANDROID_KEY_PASSWORD').orNull
]
def hasReleaseSigning = releaseSigning.values().every { it }

android {
    namespace "com.azurenight.g2048"
    compileSdk 37
    defaultConfig {
        applicationId 'com.azurenight.g2048'
        minSdk 26
        targetSdk 37
        versionCode project.findProperty('ciVersionCode')?.toInteger() ?: 101
        versionName project.findProperty('ciVersionName')?.toString() ?: '1.2'
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Keep local lint nonfatal, but make lint findings fail the CI validation job.
    lint {
        abortOnError project.hasProperty('ciBuild')
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
//    implementation 'com.android.support:appcompat-v7:28.0.0'
//    implementation 'com.android.support:support-v4:28.0.0'
    implementation('androidx.core:core:1.15.0')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}